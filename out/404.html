<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 | Not Found</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      height: 100%;
      width: 100%;
      background-color: #050811;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .bg-glow {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.04) 0%, rgba(5, 8, 17, 0) 70%);
      pointer-events: none;
    }
    .card {
      position: relative;
      z-index: 1;
      max-width: 480px;
      width: 90%;
      text-align: center;
      padding: 40px 32px;
      background: rgba(13, 19, 33, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(16px);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 9999px;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.25);
      color: #f87171;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.05em;
      margin-bottom: 24px;
    }
    .badge-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #ef4444;
      display: inline-block;
    }
    .error-code {
      font-size: 80px;
      font-weight: 900;
      line-height: 1;
      letter-spacing: -0.04em;
      background: linear-gradient(180deg, #ffffff 30%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 16px;
    }
    .error-title {
      font-size: 20px;
      font-weight: 700;
      color: #f1f5f9;
      margin-bottom: 12px;
      line-height: 1.4;
    }
    .error-desc {
      font-size: 14px;
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .divider {
      height: 1px;
      background: rgba(255, 255, 255, 0.06);
      margin: 20px 0;
    }
    .error-meta {
      font-size: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      color: #64748b;
      direction: ltr;
    }
  </style>
</head>
<body>
  <div class="bg-glow"></div>
  <div class="card">
    <div class="badge">
      <span class="badge-dot"></span>
      <span>ERROR 404</span>
    </div>
    <div class="error-code">404</div>
    <h1 class="error-title">الصفحة غير متوفرة</h1>
    <p class="error-desc">
      عفواً، الموقع أو الخدمة المطلوبة غير متوفرة حالياً أو تم إيقافها نهائياً.
      <br>
      <span style="font-size: 13px; color: #64748b; display: inline-block; margin-top: 6px;" dir="ltr">
        The requested resource is unavailable or has been decommissioned.
      </span>
    </p>
    <div class="divider"></div>
    <div class="error-meta">HTTP Status: 404 Not Found</div>
  </div>
</body>
</html>
